name: Refresh news cache

on:
  # Daily at 06:15 UTC. GitHub may delay scheduled runs during high load —
  # the manual trigger below is the reliable kick if you need an immediate refresh.
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund --omit=dev

      - name: Fetch news
        run: node scripts/fetch-news.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- landing_page/data/news-cache.json; then
            echo "No changes; skipping commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing_page/data/news-cache.json
          git commit -m "chore(news): refresh cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
